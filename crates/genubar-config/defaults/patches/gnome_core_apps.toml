# Master GTK4 Menubar Hook patch for the GNOME Core Applications suite (`~/.config/genubar/patches/`).
#
# Patch Manifest Reference (`[[patches]]` catalog or single `[meta]` file):
#   meta.id, meta.name, meta.version, meta.author, meta.description, meta.tags, meta.min_app_version
#   meta.part_of_bundles : optional list of parent bundle IDs
#   meta.restart_hint    : user guidance displayed after applying/reverting
#   meta.error_policy    : "strict" (rollback all steps on error) | "ignore_system_errors" (skip missing apps) | "ignore_all"
#   detection            : window_matches, binaries, desktop_files, flatpak_ids, home_dirs
#
# Supported `[[patches.steps]]` types:
#   "check"              - pre-flight check (`binary_exists`, `path_exists`, `flatpak_installed`, `env_equals`, `file_contains`)
#                          with `on_fail = "abort_patch" | "skip_step"`
#   "desktop_override"   - writes ~/.local/share/applications/<desktop_file> with `inject_env`, `append_args`, `force_no_dbus_activatable`
#   "cli_wrapper"        - creates ~/.local/bin/<binary_name> wrapper around `target_binary_path`
#   "flatpak_override"   - updates Flatpak user overrides (`talk_names`, `inject_env`, automatic ~/.local/lib/genubar:ro access)
#   "json_set"           - sets a dot-separated `key` to `value` inside a JSON file (`file`)
#   "text_line_append"   - appends `line` idempotently to files matched by `file_pattern` (supports single-level `*` globs)
#   "firefox_user_js"    - manages `user_pref(pref_key, pref_value)` in Firefox profiles
#   "gsettings_set"      - applies a `schema` / `key` / `value` via GSettings
#   "python_script"      - runs a reversible `# ==GenubarScript==` plugin (`apply(ctx)` / `revert(ctx, saved_state)`)
#
# Path placeholders: `{HOME}` expands to $HOME; `{GTK4_HOOK_SO}` resolves active_gtk4_hook.so.

[[patches]]
[patches.meta]
id = "gnome_core_apps_gtk4_hook"
kind = "patch"
name = "GNOME Core Applications Suite (All-in-One GTK4 Hook)"
version = "1.0.0"
author = "genubar"
description = "Injects libgenubar_gtk4_hook.so and disables DBusActivatable across 27 standard GNOME applications (Files, Ptyxis, Text Editor, Software, Settings, System Monitor, Calculator, Calendar, Clocks, Loupe, Papers, Camera, Disks, Weather, Maps, etc.)."
tags = ["gtk4", "gnome", "suite", "core"]
part_of_bundles = ["gnome_core_suite"]
restart_hint = "Close and reopen running GNOME applications (or run 'killall nautilus gnome-text-editor gnome-calculator') to activate their global menus."
error_policy = "ignore_system_errors"
origin = "built_in"

[patches.detection]
window_matches = [
    "org.gnome.Nautilus",
    "org.gnome.Ptyxis",
    "org.gnome.TextEditor",
    "org.gnome.Software",
    "org.gnome.Settings",
    "org.gnome.SystemMonitor",
    "org.gnome.Calculator",
    "org.gnome.Calendar",
    "org.gnome.clocks",
    "org.gnome.Loupe",
    "org.gnome.Papers",
    "org.gnome.Snapshot",
    "org.gnome.Showtime",
    "org.gnome.Decibels",
    "org.gnome.baobab",
    "org.gnome.DiskUtility",
    "org.gnome.Logs",
    "org.gnome.Weather",
    "org.gnome.Maps",
    "org.gnome.Contacts",
    "org.gnome.Characters",
    "org.gnome.Connections",
    "org.gnome.Boxes",
    "org.gnome.SimpleScan",
    "org.gnome.font-viewer",
    "org.gnome.Tecla",
    "org.gnome.tweaks",
    "org.gnome.Yelp",
    "yelp",
    "org.freedesktop.MalcontentControl",
    "malcontent-control",
    "org.gnome.Extensions",
    "org.gnome.Shell.Extensions",
]
desktop_files = [
    "org.gnome.Nautilus.desktop",
    "org.gnome.Ptyxis.desktop",
    "org.gnome.TextEditor.desktop",
    "org.gnome.Software.desktop",
    "org.gnome.Settings.desktop",
]

[[patches.steps]]
type = "check"
on_fail = "abort_patch"
error_message = "libgenubar_gtk4_hook.so was not found. Run 'cargo build' first."
condition = { check_type = "path_exists", path = "{GTK4_HOOK_SO}" }

# 1. GNOME Files (Nautilus)
[[patches.steps]]
type = "desktop_override"
desktop_file = "org.gnome.Nautilus.desktop"
inject_env = { LD_PRELOAD = "{GTK4_HOOK_SO}" }
force_no_dbus_activatable = true

# 2. Ptyxis Terminal
[[patches.steps]]
type = "desktop_override"
desktop_file = "org.gnome.Ptyxis.desktop"
